<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandya Bet - Verification System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .auth-container {
            background: rgba(30, 41, 59, 0.7);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo-area h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 5px;
            background: linear-gradient(to right, #f59e0b, #e11d48);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .logo-area p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .form-box {
            display: none;
        }

        .form-box.active {
            display: block;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #cbd5e1;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #f59e0b;
            box-shadow: 0 0 8px rgba(245, 158, 11, 0.4);
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.85rem;
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(to right, #f59e0b, #d97706);
            border: none;
            border-radius: 8px;
            color: #0f172a;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            text-transform: uppercase;
        }

        .auth-btn:hover {
            opacity: 0.95;
        }

        .auth-btn:active {
            transform: scale(0.98);
        }

        .switch-text {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .switch-text a {
            color: #f59e0b;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .switch-text a:hover {
            text-decoration: underline;
        }

        /* Alert/Notice for generated OTP */
        .otp-alert {
            background: rgba(245, 158, 11, 0.1);
            border: 1px dashed #f59e0b;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.85rem;
            color: #f59e0b;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="logo-area">
            <h1>Pandya Bet</h1>
            <p id="page-desc">Welcome back! Please login to your account.</p>
        </div>

        <!-- ================= LOGIN FORM ================= -->
        <div id="loginBox" class="form-box active">
            <form onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="loginUser">Username / Mobile</label>
                    <input type="text" id="loginUser" placeholder="Enter username or mobile" required>
                </div>

                <div class="input-group">
                    <label for="loginPass">Password</label>
                    <input type="password" id="loginPass" placeholder="Enter password" required>
                </div>

                <div class="actions">
                    <a href="#" class="forgot-pass" style="color: #f59e0b; text-decoration:none;">Forgot Password?</a>
                </div>

                <button type="submit" class="auth-btn">LOG IN</button>
            </form>
            <div class="switch-text">
                Don't have an account? <a onclick="toggleForm('register')">Register Now</a>
            </div>
        </div>

        <!-- ================= REGISTRATION FORM ================= -->
        <div id="registerBox" class="form-box">
            <form onsubmit="sendOTP(event)">
                <div class="input-group">
                    <label for="regUser">Create Username</label>
                    <input type="text" id="regUser" placeholder="Choose a unique username" required>
                </div>

                <div class="input-group">
                    <label for="regMobile">Mobile Number</label>
                    <input type="tel" id="regMobile" pattern="[0-9]{10}" placeholder="Enter 10-digit mobile number" required>
                </div>

                <div class="input-group">
                    <label for="regPass">Create Password</label>
                    <input type="password" id="regPass" placeholder="Enter a strong password" required>
                </div>

                <button type="submit" class="auth-btn">SEND OTP</button>
            </form>
            <div class="switch-text">
                Already have an account? <a onclick="toggleForm('login')">Login Here</a>
            </div>
        </div>

        <!-- ================= OTP VERIFICATION FORM ================= -->
        <div id="otpBox" class="form-box">
            <div class="otp-alert" id="otpDisplay">
                <!-- यहाँ कोड के ज़रिए जनरेटेड OTP दिखेगा -->
            </div>
            <form onsubmit="verifyOTP(event)">
                <div class="input-group">
                    <label for="inputOtp">Enter 4-Digit OTP</label>
                    <input type="text" id="inputOtp" maxlength="4" placeholder="Enter OTP" required style="text-align: center; font-size: 1.5rem; letter-spacing: 5px;">
                </div>

                <button type="submit" class="auth-btn">VERIFY & REGISTER</button>
            </form>
            <div class="switch-text">
                Wrong number? <a onclick="toggleForm('register')">Go Back</a>
            </div>
        </div>

    </div>

    <script>
        // टेम्परेरी डेटा होल्ड करने के लिए वेरिएबल्स
        let tempUserData = null;
        let generatedOTP = null;

        function toggleForm(formType) {
            const loginBox = document.getElementById('loginBox');
            const registerBox = document.getElementById('registerBox');
            const otpBox = document.getElementById('otpBox');
            const pageDesc = document.getElementById('page-desc');

            // सबको पहले छुपाएं
            loginBox.classList.remove('active');
            registerBox.classList.remove('active');
            otpBox.classList.remove('active');

            if (formType === 'register') {
                registerBox.classList.add('active');
                pageDesc.innerText = "Join us today! Create your betting account.";
            } else if (formType === 'otp') {
                otpBox.classList.add('active');
                pageDesc.innerText = "Enter the security code sent to your phone.";
            } else {
                loginBox.classList.add('active');
                pageDesc.innerText = "Welcome back! Please login to your account.";
            }
        }

        // स्टेप 1: रजिस्टर सबमिट होने पर OTP जनरेट करना
        function sendOTP(event) {
            event.preventDefault();

            const username = document.getElementById('regUser').value.trim();
            const mobile = document.getElementById('regMobile').value.trim();
            const password = document.getElementById('regPass').value;

            // यूजर चेक करें
            let users = JSON.parse(localStorage.getItem('pandya_users')) || [];
            const userExists = users.some(u => u.username === username || u.mobile === mobile);

            if (userExists) {
                alert("This Username or Mobile number is already registered!");
                return;
            }

            // यूजर का डेटा टेम्परेरी सेव करें
            tempUserData = { username, mobile, password, balance: 0 };

            // 4 डिजिट का रैंडम OTP बनाएं
            generatedOTP = Math.floor(1000 + Math.random() * 9000).toString();

            // OTP बॉक्स पर दिखाएं (ताकि टेस्टिंग में आसानी हो)
            document.getElementById('otpDisplay').innerHTML = `💬 SMS Sent to <b>+91 ${mobile}</b><br>Your OTP code is: <b style="font-size:1.2rem; color:#fff;">${generatedOTP}</b>`;

            // OTP स्क्रीन खोलें
            toggleForm('otp');
        }

        // स्टेप 2: OTP वेरीफाई करना और फाइनल रजिस्ट्रेशन
        function verifyOTP(event) {
            event.preventDefault();
            const userEnteredOtp = document.getElementById('inputOtp').value.trim();

            if (userEnteredOtp === generatedOTP) {
                let users = JSON.parse(localStorage.getItem('pandya_users')) || [];
                
                // फाइनल सेव
                users.push(tempUserData);
                localStorage.setItem('pandya_users', JSON.stringify(users));

                alert("✅ Mobile Verified & Registration Successful!");
                
                // साफ़ करें और लॉगिन पर भेजें
                document.getElementById('inputOtp').value = '';
                tempUserData = null;
                generatedOTP = null;
                toggleForm('login');
            } else {
                alert("❌ Invalid OTP! Please check the code again.");
            }
        }

        // लॉगिन हैंडलर
        function handleLogin(event) {
            event.preventDefault();
            const inputUser = document.getElementById('loginUser').value.trim();
            const inputPass = document.getElementById('loginPass').value;

            let users = JSON.parse(localStorage.getItem('pandya_users')) || [];
            const matchedUser = users.find(u => 
                (u.username === inputUser || u.mobile === inputUser) && u.password === inputPass
            );

            if (matchedUser) {
                alert("🎉 Login Successful! Welcome, " + matchedUser.username);
                // window.location.href = "dashboard.html"; // यहाँ अपने अगले पेज का नाम डाल सकते हो
            } else {
                alert("❌ Invalid Details!");
            }
        }
    </script>

</body>
</html>
