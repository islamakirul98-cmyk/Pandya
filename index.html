<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Next Level Live Icon</title>
  <style>
    /* Dark Background taaki neon icons ekdum solid chamke */
    body {
      background-color: #0b0c10;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      gap: 30px;
      flex-direction: column;
      font-family: 'Arial Black', sans-serif;
    }

    /* --- NEXT LEVEL LIVE BADGE --- */
    .next-level-live {
      display: flex;
      align-items: center;
      background: linear-gradient(135deg, #1f1f2e, #14141f);
      padding: 10px 22px;
      border-radius: 12px;
      border: 2px solid #ff0055;
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.4), inset 0 0 10px rgba(255, 0, 85, 0.2);
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    /* Glow wave jo pure icon ke piche chalegi */
    .next-level-live::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 0, 85, 0.15) 0%, transparent 70%);
      animation: rotateGlow 4s linear infinite;
    }

    /* Red Dot with Wave Animation */
    .live-dot-container {
      position: relative;
      width: 14px;
      height: 14px;
      margin-right: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .main-dot {
      width: 12px;
      height: 12px;
      background-color: #ff0055;
      border-radius: 50%;
      box-shadow: 0 0 10px #ff0055;
      z-index: 2;
    }

    .pulse-wave {
      position: absolute;
      width: 100%;
      height: 100%;
      background-color: #ff0055;
      border-radius: 50%;
      z-index: 1;
      animation: heavyPulse 1.5s infinite ease-out;
    }

    /* Neon Text Style */
    .live-text {
      color: #ffffff;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.6), 0 0 15px #ff0055;
      z-index: 2;
      animation: textBlink 2s infinite alternate;
    }

    /* --- ANIMATIONS --- */
    @keyframes heavyPulse {
      0% {
        transform: scale(1);
        opacity: 0.8;
      }
      100% {
        transform: scale(3);
        opacity: 0;
      }
    }

    @keyframes textBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.85; }
    }

    @keyframes rotateGlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Hover karne par aur solid dynamic effect */
    .next-level-live:hover {
      transform: scale(1.05);
      border-color: #00ffcc;
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.6);
    }
    .next-level-live:hover .main-dot, 
    .next-level-live:hover .pulse-wave {
      background-color: #00ffcc;
      box-shadow: 0 0 15px #00ffcc;
    }
    .next-level-live:hover .live-text {
      text-shadow: 0 0 15px #00ffcc;
    }
  </style>
</head>
<body>

  <!-- Yeh raha tumhara real-time Live Icon -->
  <div class="next-level-live">
    <div class="live-dot-container">
      <div class="main-dot"></div>
      <div class="pulse-wave"></div>
    </div>
    <span class="live-text">LIVE</span>
  </div>

</body>
</html>
