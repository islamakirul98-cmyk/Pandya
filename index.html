<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandya Bet - Multi OTP Verification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .auth-container {
            background: rgba(30, 41, 59, 0.7);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo-area h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 5px;
            background: linear-gradient(to right, #f59e0b, #e11d48);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .logo-area p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .form-box { display: none; }
        .form-box.active { display: block; }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #cbd5e1;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #f59e0b;
            box-shadow: 0 0 8px rgba(245, 158, 11, 0.4);
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(to right, #f59e0b, #d97706);
            border: none;
            border-radius: 8px;
            color: #0f172a;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Verification Buttons Styling */
        .otp-options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .verify-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: opacity 0.2s;
        }

        .verify-btn:hover { opacity: 0.9; }

        .whatsapp-btn { background: #25D366; color: #fff; }
        .telegram-btn { background: #0088cc; color: #fff; }

        .otp-notice {
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.85rem;
            color: #cbd5e1;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="logo-area">
            <h1>Pandya Bet</h1>
            <p id="page-desc">Register with Free Multi-OTP System</p>
        </div>

        <!-- STEP 1: REGISTRATION DETAILS -->
        <div id="registerBox" class="form-box active">
            <form onsubmit="initiateOTP(event)">
                <div class="input-group">
                    <label for="regUser">Username</label>
                    <input type="text" id="regUser" placeholder="Choose username" required>
                </div>
                <div class="input-group">
                    <label for="regMobile">Mobile Number</label>
                    <input type="tel" id="regMobile" pattern="[0-9]{10}" placeholder="Enter 10-digit mobile number" required>
                </div>
                <div class="input-group">
                    <label for="regPass">Password</label>
                    <input type="password" id="regPass" placeholder="Create password" required>
                </div>

                <button type="submit" class="auth-btn">CONTINUE TO VERIFY</button>
            </form>
        </div>

        <!-- STEP 2: MULTI-OTP SELECTION & INPUT -->
        <div id="otpBox" class="form-box">
            <div class="otp-notice">
                ⚠️ मुफ़्त कोड के लिए नीचे WhatsApp या Telegram में से किसी एक पर क्लिक करें:
            </div>
            
            <div class="otp-options-container">
                <!-- WhatsApp Button (यहाँ अपना व्हाट्सऐप नंबर डाल सकते हैं) -->
                <a href="#" id="waLink" target="_blank" class="verify-btn whatsapp-btn">
                     🟢 GET OTP ON WHATSAPP
                </a>

                <!-- Telegram Button -->
                <a href="https://t.me/BotFather" target="_blank" class="verify-btn telegram-btn">
                     🔵 GET OTP ON TELEGRAM
                </a>
            </div>

            <form onsubmit="verifyOTP(event)">
                <div class="input-group">
                    <label for="inputOtp">Enter 6-Digit OTP</label>
                    <input type="text" id="inputOtp" maxlength="6" placeholder="Enter OTP" required style="text-align: center; font-size: 1.5rem; letter-spacing: 5px;">
                </div>
                <button type="submit" class="auth-btn">VERIFY & REGISTER</button>
            </form>
        </div>
    </div>

    <script>
        let generatedOTP = null;
        let tempUserData = null;

        function initiateOTP(event) {
            event.preventDefault();

            const username = document.getElementById('regUser').value.trim();
            const mobile = document.getElementById('regMobile').value.trim();
            const password = document.getElementById('regPass').value;

            // 6-डिजिट का कोड जनरेट करें
            generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
            tempUserData = { username, mobile, password };

            // 🟢 WhatsApp Link Setup: जब यूज़र क्लिक करेगा तो सीधे आपके नंबर पर उसका कोड मैसेज सेंड होने के लिए तैयार रहेगा
            // यहाँ '919999999999' की जगह अपना खुद का व्हाट्सएप नंबर डाल देना (कंट्री कोड 91 के साथ)
            const adminWhatsAppNumber = "919999999999"; 
            const message = encodeURIComponent(`Hello Admin, I am registering on Pandya Bet. Please give me my verification OTP code for username: ${username}`);
            document.getElementById('waLink').href = `https://wa.me/${adminWhatsAppNumber}?text=${message}`;

            // टेस्टिंग के लिए स्क्रीन पर भी अलर्ट दिखा देते हैं
            alert("वेरिफिकेशन लिंक तैयार! टेस्टिंग के लिए आपका OTP कोड है: " + generatedOTP);

            // स्क्रीन बदलें
            document.getElementById('registerBox').classList.remove('active');
            document.getElementById('otpBox').classList.add('active');
            document.getElementById('page-desc').innerText = "Verify via WhatsApp or Telegram";
        }

        function verifyOTP(event) {
            event.preventDefault();
            const userOtp = document.getElementById('inputOtp').value.trim();

            if (userOtp === generatedOTP) {
                let users = JSON.parse(localStorage.getItem('pandya_users')) || [];
                users.push(tempUserData);
                localStorage.setItem('pandya_users', JSON.stringify(users));

                alert("🎉 Registration Successful! Welcome to Pandya Bet.");
                // window.location.href = "dashboard.html"; // लॉगिन के बाद यहाँ भेजें
            } else {
                alert("❌ Wrong OTP! Please check the code again.");
            }
        }
    </script>
</body>
</html>
