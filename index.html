<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandya Bet - Fast Mobile Auth</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .auth-container {
            background: rgba(30, 41, 59, 0.7);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
        }

        .logo-area h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 5px;
            background: linear-gradient(to right, #f59e0b, #e11d48);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .logo-area p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .form-box { display: none; }
        .form-box.active { display: block; }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #cbd5e1;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #f59e0b;
            box-shadow: 0 0 8px rgba(245, 158, 11, 0.4);
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(to right, #f59e0b, #d97706);
            border: none;
            border-radius: 8px;
            color: #0f172a;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        /* Loading Spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid #0f172a;
            border-top: 3px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Simulated Push Notification */
        .sms-notification {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 350px;
            background: #1e293b;
            border-left: 5px solid #f59e0b;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 9999;
            transition: top 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #fff;
            text-align: left;
        }

        .sms-notification.show { top: 20px; }
        .sms-header { font-size: 0.75rem; color: #94a3b8; margin-bottom: 4px; font-weight: bold; display: flex; justify-content: space-between; }

    </style>
</head>
<body>

    <!-- सिम्युलेटेड असली SMS नोटिफिकेशन बॉक्स -->
    <div id="smsPop" class="sms-notification">
        <div class="sms-header">
            <span>💬 MESSAGES (NOW)</span>
            <span style="color:#f59e0b;">PANDYA_BET_SMS</span>
        </div>
        <p style="font-size: 0.9rem;" id="smsText"></p>
    </div>

    <div class="auth-container">
        <div class="logo-area">
            <h1>Pandya Bet</h1>
            <p id="page-desc">Enter details to get fast mobile OTP</p>
        </div>

        <!-- STEP 1: MOBILE REGISTER -->
        <div id="registerBox" class="form-box active">
            <form onsubmit="sendInstantOTP(event)">
                <div class="input-group">
                    <label for="regUser">Username</label>
                    <input type="text" id="regUser" placeholder="Choose username" required>
                </div>
                <div class="input-group">
                    <label for="regMobile">Mobile Number</label>
                    <input type="tel" id="regMobile" pattern="[0-9]{10}" placeholder="Enter 10-digit mobile number" required>
                </div>
                <div class="input-group">
                    <label for="regPass">Password</label>
                    <input type="password" id="regPass" placeholder="Create password" required>
                </div>

                <button type="submit" id="submitBtn" class="auth-btn">
                    <span id="btnText">GET MOBILE OTP</span>
                    <div id="btnSpinner" class="spinner"></div>
                </button>
            </form>
        </div>

        <!-- STEP 2: VERIFY INPUT (बिना कहीं भेजे सीधे इसी पेज पर) -->
        <div id="otpBox" class="form-box">
            <form onsubmit="verifyInstantOTP(event)">
                <div class="input-group">
                    <label for="inputOtp">Enter 6-Digit OTP</label>
                    <input type="text" id="inputOtp" maxlength="6" placeholder="Enter OTP" required style="text-align: center; font-size: 1.5rem; letter-spacing: 5px;">
                </div>
                <button type="submit" class="auth-btn">VERIFY & REGISTER</button>
            </form>
        </div>
    </div>

    <script>
        let currentOTP = null;
        let userDataCache = null;

        function sendInstantOTP(event) {
            event.preventDefault();

            const username = document.getElementById('regUser').value.trim();
            const mobile = document.getElementById('regMobile').value.trim();
            const password = document.getElementById('regPass').value;

            userDataCache = { username, mobile, password };

            // बटन पर एनीमेशन चालू करें (असली गेटवे जैसा फील देने के लिए)
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const submitBtn = document.getElementById('submitBtn');

            btnText.innerText = "SENDING SMS VIA NETWORK...";
            btnSpinner.style.display = "block";
            submitBtn.style.disabled = true;

            // 1.5 सेकंड का नकली डिले ताकि लगे कि नेटवर्क काम कर रहा है
            setTimeout(() => {
                // 6 डिजिट कोड जनरेट करें
                currentOTP = Math.floor(100000 + Math.random() * 900000).toString();

                // नोटिफिकेशन शो करें (जैसे असली मोबाइल मैसेज आता है ऊपर से)
                const smsPop = document.getElementById('smsPop');
                document.getElementById('smsText').innerHTML = `Your registration OTP for Pandya Bet is <b>${currentOTP}</b>. Do not share this code with anyone.`;
                smsPop.classList.add('show');

                // अगर मोबाइल है तो वाइब्रेट करे
                if (navigator.vibrate) { navigator.vibrate(200); }

                // 4 सेकंड बाद नोटिफिकेशन वापस छुपा दें
                setTimeout(() => { smsPop.classList.remove('show'); }, 5000);

                // फॉर्म बदलें
                btnSpinner.style.display = "none";
                document.getElementById('registerBox').classList.remove('active');
                document.getElementById('otpBox').classList.add('active');
                document.getElementById('page-desc').innerText = `Enter the verification code sent to +91 ${mobile}`;

            }, 1500);
        }

        function verifyInstantOTP(event) {
            event.preventDefault();
            const enteredOtp = document.getElementById('inputOtp').value.trim();

            if (enteredOtp === currentOTP) {
                let users = JSON.parse(localStorage.getItem('pandya_users')) || [];
                users.push(userDataCache);
                localStorage.setItem('pandya_users', JSON.stringify(users));

                alert("🎉 Mobile Verified Successfully! Account Created.");
                // यहाँ आप यूज़र को डायरेक्ट अंदर गेम वाले पेज पर भेज सकते हैं:
                // window.location.href = "dashboard.html";
            } else {
                alert("❌ Incorrect OTP! Please try again.");
            }
        }
    </script>
</body>
</html>
